services:
  bunri:
    build:
      context: .
      target: cpu
    image: bunri:cpu
    volumes:
      - ./songs:/in:ro
      - ./out:/out
      - bunri-models:/root/.cache/bunri/models
    # Usage:
    #   docker compose run --rm bunri /in/song.mp3 -o /out
    # (entrypoint is `bunri`; args after the service name are passed straight
    # through to the CLI)

volumes:
  bunri-models:
