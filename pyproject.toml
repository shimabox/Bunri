[project]
name = "bunri"
version = "0.5.0"
description = "Instrument stem extraction and practice package generator for songs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "MODEL_LICENSES.md"]
authors = [
    { name = "shimabox", email = "shimabox@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "audio-separator[cpu]==0.44.3",
    "jinja2>=3.1",
    "numpy<2.5",
    "rich",
    "soundfile",
    "torch>=2.3",
    "torchvision",
    "typer",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
bunri = "bunri.cli:app"
bunri-web = "bunri.web.cli:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# audio-separator==0.44.3 depends on onnx-weekly, which only publishes pre-releases.
prerelease = "if-necessary"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
# PyPI's default linux torch/torchvision wheels bundle CUDA (nvidia-* deps,
# multi-GB). The cpu Docker image never uses a GPU, so route linux resolution
# to the official CPU-only wheel index instead. macOS keeps resolving from
# PyPI as before (MPS-capable wheels live there, not on this CPU index).
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx",
    # Property-based tests for the job store's load/save invariants (see
    # tests/test_web_jobs_properties.py). Run derandomized -- see
    # tests/conftest.py -- so CI and local runs stay reproducible.
    "hypothesis",
    "playwright>=1.61.0",
    "pytest",
    # Runs the suite across multiple workers (-n auto) to cut CI wall time.
    "pytest-xdist>=3.8.0",
]
